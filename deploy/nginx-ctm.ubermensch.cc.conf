# Autoreply — ctm.ubermensch.cc
#
# The landing page and APK downloads are served straight from disk; only the API and the
# one-time pairing page reach the Node bridge on 127.0.0.1:9410.
#
# The 443 block is hand-written: certbot 5.7.0 on this host cannot run its nginx installer
# (acme.crypto_util.gen_ss_cert is gone), so renew with:
#   certbot renew --deploy-hook "systemctl reload nginx"

server {
    server_name ctm.ubermensch.cc;
    client_max_body_size 256k;

    root /opt/mobile/site;
    index index.html;

    access_log /var/log/nginx/ctm.access.log;
    error_log  /var/log/nginx/ctm.error.log;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # --- API ---------------------------------------------------------------------
    # Server-sent events. A regex location is matched before the plain prefixes below,
    # so this keeps its no-buffering settings even though /v1/ is also proxied.
    location ~ ^/(link|v1/sessions)/[^/]+/stream$ {
        proxy_pass http://127.0.0.1:9410;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        chunked_transfer_encoding off;
    }

    location = /healthz { proxy_pass http://127.0.0.1:9410; }

    location /v1/ {
        proxy_pass http://127.0.0.1:9410;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location /link/ {
        proxy_pass http://127.0.0.1:9410;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # --- static ------------------------------------------------------------------
    location /download/ {
        # Android refuses to install an APK served as text/plain.
        types { }
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition "attachment";
        add_header Cache-Control "public, max-age=300";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /explainer.mp4 {
        add_header Cache-Control "public, max-age=86400";
        add_header Accept-Ranges bytes;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=600";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/ctm.ubermensch.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ctm.ubermensch.cc/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name ctm.ubermensch.cc;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
