name: Build APK

# Backup build path. The primary build happens on the server, which already has the
# Flutter and Android SDKs; this exists so the APK can be produced without that machine.
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      # Without this the release build silently falls back to the debug key, and the
      # resulting APK cannot upgrade an install signed with the real one.
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No keystore secret set — this APK will be signed with the debug key and cannot upgrade a release install."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/autoreply-release.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=${KEY_ALIAS:-autoreply}
          storeFile=../autoreply-release.jks
          EOF

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: autoreply-apk
          path: app/build/app/outputs/flutter-apk/*.apk
          retention-days: 30
